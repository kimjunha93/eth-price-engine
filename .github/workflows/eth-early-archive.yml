name: ETH Early Exchange Archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eth-early-archive.yml'
permissions:
  contents: write
concurrency:
  group: eth-data-update
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python v43/early_bitfinex_archive.py
      - name: Publish isolated archive
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eth_data/early_exchange/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive official early Bitfinex ETHUSD candles"
          git pull --rebase origin main
          git push origin HEAD:main
