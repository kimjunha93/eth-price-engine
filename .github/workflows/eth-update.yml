name: ETH Auto Update

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'eth_*.py'
      - '.github/workflows/eth-update.yml'

permissions:
  contents: write

concurrency:
  group: eth-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Collect ETH data
        run: python eth_collect_v12.py

      - name: Analyze ETH data
        run: python eth_analyze_v42.py

      - name: Analyze historical waves
        run: python eth_wave_v42.py

      - name: Analyze intraday extrema
        run: python eth_extrema_v42.py

      - name: Test first-touch baseline
        run: python eth_touch_v42.py

      - name: Audit alignment and test historical neighbors
        run: python eth_research_v42.py

      - name: Evaluate chronological wave models
        run: python eth_walkforward_v42.py

      - name: Generate guarded forecast diagnostics
        run: python eth_diagnostics_v42.py

      - name: Run V4.3 guarded path audit
        run: python v43/path_audit.py

      - name: Generate V4.3 guarded structure snapshot
        run: python v43/structure_snapshot.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eth_data
          if ! git diff --cached --quiet; then
            git commit -m "Auto update ETH data"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
