name: ETH Auto Update

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'eth_*.py'
      - 'v43/**'
      - '.github/workflows/eth-update.yml'

permissions:
  contents: write

concurrency:
  group: eth-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install requests pandas matplotlib

      - name: Regenerate from latest main and publish without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python eth_collect_v12.py
            python eth_analyze_v42.py
            python eth_wave_v42.py
            python eth_extrema_v42.py
            python eth_touch_v42.py
            python eth_research_v42.py
            python eth_walkforward_v42.py
            python eth_diagnostics_v42.py
            python v43/path_audit.py
            python v43/structure_snapshot.py
            python v43/operations.py
            node v43/path_operations.cjs --test
            node v43/path_operations.cjs --score
            node v43/extreme_monitor.cjs --test
            node v43/extreme_monitor.cjs --score
            node v43/learning_monitor.cjs
            python v43/hourly_touch_audit.py eth_data/Upbit_ETHKRW_1d.csv eth_data/Upbit_ETHKRW_1h.csv eth_data/v43_output/hourly_touch_audit.json
            python -c 'import json; from pathlib import Path; p=Path("eth_data"); a=json.loads((p/"audit.json").read_text()); assert a and not any("error" in x for x in a), "collection error"; s=json.loads((p/"structure_snapshot_v43.json").read_text()); assert s["freshness_pass"], "stale structure snapshot"'
            node v43/prospective_monitor.cjs --test
            node v43/prospective_monitor.cjs
            git add -A -- eth_data ':!eth_data/forecast_ledger_v43.jsonl' ':!eth_data/forecast_ledger_v43.jsonl.lock' ':!eth_data/path_ledger_v43.jsonl' ':!eth_data/path_ledger_v43.jsonl.lock' ':!eth_data/extreme_ledger_v43.jsonl' ':!eth_data/extreme_ledger_v43.jsonl.lock'
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Auto update ETH data"
            if git push origin HEAD:main; then exit 0; fi
            echo "Publish rejected; regenerate from latest remote, attempt $attempt"
            sleep "$((attempt * 3))"
          done
          exit 1
